{{- $src := .Get "src" -}}
{{- if not $src }}{{ errorf "video shortcode: `src` is required (%s)" .Position }}{{ end -}}
{{- $height := .Get "height" | default "70vh" -}}
{{- $width := .Get "width" | default "auto" -}}
<video style="max-height: {{ $height }}; width: {{ $width }}; max-width: 100%; display: block; margin: 0 auto;" controls autoplay muted>
    <source src="{{ $src }}" type="video/webm">
    Your browser does not support the video tag.
</video>
